services:
  db:
    image: postgres:15-alpine
    container_name: sql-batch-practice-db-02
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: practice_db_02
    ports:
      - "25432:5432"
    volumes:
      - ./infra/postgres/data2:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
